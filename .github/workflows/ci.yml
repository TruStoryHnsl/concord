name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      # node-datachannel fetches a prebuilt native addon during install;
      # that download to GitHub release assets occasionally hangs up the
      # socket, and its source-build fallback is broken on Node 24
      # (prebuild 13 → "N-API version undefined"). The prebuilt exists for
      # linux-x64/node-24, so a retry clears the transient failure.
      - name: Install dependencies (retry on transient native fetch)
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt"
            if npm ci; then exit 0; fi
            echo "npm ci failed; cleaning and retrying"
            rm -rf node_modules
            sleep 10
          done
          exit 1
      # Non-blocking: 171 pre-existing react-hooks v6 findings inherited
      # from the upstream client (same count there). Flip to blocking
      # once that debt is paid down.
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build

  server:
    name: Server — deps + bytecode check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .

  compose:
    name: Compose — config validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml against the template env
        run: |
          cp .env.example .env
          docker compose config -q
